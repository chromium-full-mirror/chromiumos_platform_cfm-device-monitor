start on starting system-services
stop on stopping system-services
respawn
respawn limit 3 10

pre-start script
  board=$(grep CHROMEOS_RELEASE_BOARD /etc/lsb-release | cut -d '=' -f 2)
  if [ "${board}" = fizz ]; then
    chown cfm-monitor /sys/class/chromeos/cros_ec/usb/vbus_disable
    chown cfm-monitor /sys/class/chromeos/cros_ec/usb/vbus_enable
  elif [ "${board}" = guado ]; then
    echo 209 > /sys/class/gpio/export
    chown cfm-monitor /sys/class/gpio/gpio209/direction
    chown cfm-monitor /sys/class/gpio/gpio209/value
    echo 218 > /sys/class/gpio/export
    chown cfm-monitor /sys/class/gpio/gpio218/direction
    chown cfm-monitor /sys/class/gpio/gpio218/value
    echo 219 > /sys/class/gpio/export
    chown cfm-monitor /sys/class/gpio/gpio219/direction
    chown cfm-monitor /sys/class/gpio/gpio219/value
  fi
end script


post-stop script
  board=$(grep CHROMEOS_RELEASE_BOARD /etc/lsb-release | cut -d '=' -f 2)
  if [ "${board}" = fizz ]; then
    chown root /sys/class/chromeos/cros_ec/usb/vbus_disable
    chown root /sys/class/chromeos/cros_ec/usb/vbus_enable
  elif [ "${board}" = guado ]; then
    echo 209 > /sys/class/gpio/unexport
    echo 218 > /sys/class/gpio/unexport
    echo 219 > /sys/class/gpio/unexport
  fi
end script

expect fork

# -N Enter a new cgroup namespace.
# -e enter new network namespace.
# -i Exit immediately after fork (do not act as init).
# -l Enter new IPC namespace.
# -p Enter new pid namespace
# -n Set no_new_privs
exec minijail0 -u cfm-monitor -g cfm-monitor \
  -N -e -i -l -p -n /usr/sbin/huddly-monitor
